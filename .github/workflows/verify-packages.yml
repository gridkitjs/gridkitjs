name: Verify packages

# Tests the packages as they would be published: packed tarballs, linted,
# then installed into fresh Vite, Next.js and Node apps. Reusable, so CI and
# the release workflow run the same checks.
on:
  workflow_call:
    inputs:
      upload-tarballs:
        description: Upload the verified tarballs as the `package-tarballs` artifact.
        type: boolean
        default: false
      snapshot:
        description: Version the packages as a `dev` snapshot before packing.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      # The smoke apps install with npm, as a consumer would, so they get
      # npm's cache rather than pnpm's store; keyed on their pinned versions.
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: smoke-npm-${{ runner.os }}-${{ hashFiles('scripts/smoke/*/package.json') }}
          restore-keys: smoke-npm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Each package with a pending changeset, and each that depends on one,
      # takes a 0.0.0-dev-<timestamp> version. The rewrite stays in this
      # job's checkout; the tarballs carry it.
      - name: Version the packages as a dev snapshot
        if: inputs.snapshot
        run: pnpm changeset version --snapshot dev

      - name: Pack the published packages
        run: node scripts/pack-packages.mjs

      - name: Lint the tarballs
        run: node scripts/lint-packages.mjs

      - name: Smoke-test the tarballs in fresh apps
        run: node scripts/smoke-packages.mjs

      # `.pack/` is a dot-directory, which upload-artifact skips by default.
      - if: inputs.upload-tarballs
        uses: actions/upload-artifact@v7
        with:
          name: package-tarballs
          path: .pack/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
