name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow re-runs every check on the commit it releases, and
  # publishes the tarballs the `packages` job verified.
  workflow_call:
    inputs:
      upload-tarballs:
        description: Upload the verified tarballs as the `package-tarballs` artifact.
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the `packageManager` field in package.json,
      # so there is only one place to bump it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

      # Checks against the next site's tag list (next.gridkitjs.com), which
      # carries the examples for merged but unreleased features. Skips with
      # a warning while that list is unavailable (a 404, the host not
      # resolving yet, or a 402 while the site is suspended); fails on an
      # unregistered tag or any other error.
      - run: node scripts/check-mdx-tags.mjs

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The component tests, one job per Playwright project so they run side by
  # side: the three desktop browsers, and a Chromium and a WebKit phone that
  # run the tests tagged `@touch`. Coverage is measured in desktop Chromium
  # alone: the projects share test ids, so their coverage files would
  # collide, and one browser is enough to measure what the tests reach.
  e2e-browser:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      # A failure in one project still lets the others finish, so the run
      # shows every browser that is broken.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, chromium-touch, webkit-touch]
        # The browser each project installs.
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: chromium-touch
            browser: chromium
          - project: webkit-touch
            browser: webkit
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Cached separately from pnpm's own store, per browser since each job
      # installs only its own, and keyed on the pinned Playwright version so
      # a bump invalidates it automatically.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('apps/playground/package.json') }}

      - run: pnpm --filter playground exec playwright install --with-deps ${{ matrix.browser }}

      - if: matrix.project == 'chromium'
        run: pnpm --filter playground test:e2e:coverage

      - if: matrix.project != 'chromium'
        run: pnpm --filter playground test:e2e --project=${{ matrix.project }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/playground/playwright-report/
            apps/playground/test-results/
          retention-days: 7

      - if: always() && matrix.project == 'chromium'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: apps/playground/coverage/
          retention-days: 7

  # Branch protection on main requires a check named exactly `e2e`, and the
  # browser jobs report as `e2e (chromium)` and so on, so this job reports
  # it on their behalf. `always()` rather than `!cancelled()`: a skipped
  # required check counts as passed, so this job must run and fail when the
  # browser jobs fail or are cancelled.
  e2e:
    needs: e2e-browser
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser to pass
        env:
          RESULT: ${{ needs.e2e-browser.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::The browser tests ended as $RESULT."
            exit 1
          fi

  # The packages as consumers install them: packed, linted, and smoke-tested
  # in fresh apps. Check name: `packages / verify`.
  packages:
    permissions:
      contents: read
    uses: ./.github/workflows/verify-packages.yml
    with:
      # `inputs` is empty on a push or pull request, so this is false there.
      upload-tarballs: ${{ inputs.upload-tarballs == true }}
