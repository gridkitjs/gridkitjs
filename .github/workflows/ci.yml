name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow re-runs every check on the commit it releases, and
  # publishes the tarballs the `packages` job verified.
  workflow_call:
    inputs:
      upload-tarballs:
        description: Upload the verified tarballs as the `package-tarballs` artifact.
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the `packageManager` field in package.json,
      # so there is only one place to bump it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

      # Skips with a warning while the website has not yet published its
      # tag list (a 404); fails on an unregistered tag or any other error.
      - run: node scripts/check-mdx-tags.mjs

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Cached separately from pnpm's own store, keyed on the pinned
      # Playwright version so a bump invalidates it automatically.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/playground/package.json') }}

      - run: pnpm --filter playground exec playwright install --with-deps chromium
      - run: pnpm --filter playground test:e2e:coverage

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report/
            apps/playground/test-results/
          retention-days: 7

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/playground/coverage/
          retention-days: 7

  # The packages as consumers install them: packed, linted, and smoke-tested
  # in fresh apps. Check name: `packages / verify`.
  packages:
    permissions:
      contents: read
    uses: ./.github/workflows/verify-packages.yml
    with:
      # `inputs` is empty on a push or pull request, so this is false there.
      upload-tarballs: ${{ inputs.upload-tarballs == true }}
