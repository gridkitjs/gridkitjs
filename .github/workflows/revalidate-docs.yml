name: Publish docs manifest

# Builds docs-manifest.json (scripts/build-docs-manifest.mjs) and pushes it
# to the orphan docs-meta branch, where the website reads every page,
# changelog and version in one request, then asks the website to
# revalidate. main is protected, so the manifest cannot live there.
on:
  push:
    branches: [main]
    # Docs pages, changelogs and versions: everything the manifest carries.
    paths:
      - "packages/*/docs/**"
      - "packages/*/CHANGELOG.md"
      - "packages/*/package.json"
  # Run by hand from another branch to publish a preview manifest to
  # docs-meta-<branch>, for the website's DOCS_MANIFEST_REF. Only a run on
  # main notifies the website.
  workflow_dispatch:

permissions:
  contents: write

# Each run commits on top of the last one on its manifest branch, so runs
# for the same ref queue rather than race.
concurrency:
  group: docs-manifest-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Each file's lastModified comes from its git history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build the manifest
        run: node scripts/build-docs-manifest.mjs "$RUNNER_TEMP/docs-manifest.json"

      # Committed with git plumbing, so the checkout stays on the source
      # commit and the manifest branch never shares history with main.
      - name: Push the manifest to its branch
        id: publish
        env:
          REF_NAME: ${{ github.ref_name }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ "$REF_NAME" = main ]; then
            branch=docs-meta
          else
            branch="docs-meta-${REF_NAME//\//-}"
          fi
          blob=$(git hash-object -w "$RUNNER_TEMP/docs-manifest.json")
          tree=$(printf '100644 blob %s\tdocs-manifest.json\n' "$blob" | git mktree)
          parent=()
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch --quiet origin "refs/heads/$branch"
            parent=(-p FETCH_HEAD)
          fi
          commit=$(git commit-tree "$tree" "${parent[@]}" -m "docs: publish the manifest for $GITHUB_SHA")
          git push origin "$commit:refs/heads/$branch"
          echo "manifest-sha=$commit" >> "$GITHUB_OUTPUT"

      # ts is Unix time in seconds; the website rejects a request whose ts is
      # more than five minutes off, so a captured one cannot be replayed.
      # The request follows redirects (a 308 re-sends the POST body) and the
      # step fails unless the final response is a 2xx.
      - name: Sign and send revalidation request
        if: github.ref == 'refs/heads/main'
        env:
          SECRET: ${{ secrets.DOCS_REVALIDATE_SECRET }}
          URL: ${{ vars.WEBSITE_REVALIDATE_URL }}
          MANIFEST_SHA: ${{ steps.publish.outputs.manifest-sha }}
        run: |
          body=$(jq -nc \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg manifestSha "$MANIFEST_SHA" \
            --argjson ts "$(date +%s)" \
            '{ref: $ref, sha: $sha, manifestSha: $manifestSha, ts: $ts}')
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/^.* //')
          status=$(curl --location --fail-with-body -sS --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/revalidate-response.txt" -w '%{http_code}' \
            -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data-binary "$body") || true
          echo "http_code=$status"
          cat "$RUNNER_TEMP/revalidate-response.txt" || true
          echo
          case "$status" in
            2*) ;;
            *) echo "::error::revalidation returned HTTP ${status:-none}"; exit 1 ;;
          esac
