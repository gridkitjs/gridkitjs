name: Release

# Every push to main goes through here, and scripts/release-plan.mjs decides
# what it calls for:
#
# - Changesets pending: the bot opens or updates the "chore: version
#   packages" PR, and when the push changed a published package's src/, a
#   dev snapshot (0.0.0-dev-<timestamp>) goes to npm under the `dev`
#   dist-tag, after the same pack, lint and smoke checks as CI. No git tags.
# - No changesets pending, but a version that is not on npm or not tagged
#   (the Version Packages PR just merged, or a release stopped part-way):
#   CI re-runs on this commit, the `release` environment's reviewer
#   approves, and the tarballs CI verified are published, tagged and given
#   GitHub Releases. The production docs manifest then goes to docs-meta.
# - Otherwise nothing.
#
# npm authenticates through trusted publishing (OIDC); no npm token exists.
# Each package's trusted publisher names this file with no environment, so
# snapshots publish without waiting; the gate for stable releases is the
# `release` environment on the publish job.
#
# Run it by hand to retry a release, to rehearse one (dry run: everything
# but the publishing, tagging, releasing and pushing), or with mode
# docs-only to ship docs alone: once approved, the manifest of main's head
# goes to docs-meta, with no npm step. A dry run can start from any branch,
# though the approved jobs still run only on main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Show what would be published, tagged and released, without doing it.
        type: boolean
        default: false
      mode:
        description: "auto: whatever the repository's state calls for. docs-only: skip npm."
        type: choice
        options: [auto, docs-only]
        default: auto

permissions:
  contents: read

# Runs queue rather than overlap, so two runs never push the version branch
# or publish at once. Dry runs change nothing, so they queue among
# themselves and never displace a real run waiting its turn.
concurrency:
  group: ${{ inputs.dry-run && 'release-dry-run' || 'release' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # stable, snapshot or none.
      release: ${{ steps.plan.outputs.release }}
      has-changesets: ${{ steps.plan.outputs.has-changesets }}
      # JSON array of { name, version } not yet on npm or not tagged.
      unreleased: ${{ steps.plan.outputs.unreleased }}
    steps:
      # Snapshots publish without an approval, so only main may publish.
      - name: Allow only dry runs off main
        if: github.ref != 'refs/heads/main' && !inputs.dry-run
        run: |
          echo "::error::Only a dry run can start from $GITHUB_REF_NAME; releases publish from main."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # BEFORE is the commit the push replaced, empty on a manual run, which
      # snapshots whenever changesets are pending.
      - name: Plan the release
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: node scripts/release-plan.mjs --mode "$MODE" --since "$BEFORE"

  version-pr:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The bot opens the PR and commits to it: GitHub starts no workflow for
      # a PR or commit made with GITHUB_TOKEN, so CI would never report on
      # it and main's required checks would block the merge. `workflows:
      # write` because the version branch is force-moved onto the latest
      # main, and GitHub refuses an App's ref update that brings in a
      # workflow change without it.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # No `publish-script`: this only maintains the PR. Publishing is the
      # jobs below, from verified tarballs. The version commit goes through
      # the GitHub API as the bot, signed, so no git credentials are needed;
      # it is built on a `changesets-ghcommit-temp/` branch, then deleted.
      - uses: changesets/action@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm version-packages
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"

  snapshot-packages:
    needs: plan
    if: needs.plan.outputs.release == 'snapshot'
    permissions:
      contents: read
    uses: ./.github/workflows/verify-packages.yml
    with:
      snapshot: true
      upload-tarballs: true

  snapshot:
    needs: [plan, snapshot-packages]
    if: needs.plan.outputs.release == 'snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      # JSON: package name to the version its tarball holds, all five; a
      # package with no pending changeset keeps its released version.
      versions: ${{ steps.publish.outputs.versions }}
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships npm 11, which trusted publishing needs (11.5.1 or
      # newer; the script checks).
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: package-tarballs
          path: ${{ runner.temp }}/package-tarballs

      - name: Publish the snapshot under the dev dist-tag
        id: publish
        run: >-
          node scripts/publish-tarballs.mjs
          --pack-dir "$RUNNER_TEMP/package-tarballs"
          --tag dev
          ${{ inputs.dry-run && '--dry-run' || '' }}

  # Every CI check again, on the commit being released; its `packages` job
  # uploads the tarballs it verified, which are the ones published.
  checks:
    needs: plan
    if: needs.plan.outputs.release == 'stable'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      upload-tarballs: true

  # A docs-only run has no checks and publishes nothing to npm: it passes
  # through this job for the environment's approval alone, so production
  # docs never change unapproved.
  publish:
    needs: [plan, checks]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      ((needs.plan.outputs.release == 'stable' && needs.checks.result == 'success') ||
      inputs.mode == 'docs-only')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The approval gate: the job starts once the environment's reviewer
    # approves. Its deployment branch rule allows main only, so a dry run of
    # a stable or docs-only release also runs on main and waits for
    # approval.
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      # JSON: package name to its version, all five.
      versions: ${{ steps.publish.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
        if: needs.plan.outputs.release == 'stable'

      # Node 24 ships npm 11, which trusted publishing needs (11.5.1 or
      # newer; the script checks).
      - uses: actions/setup-node@v7
        if: needs.plan.outputs.release == 'stable'
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.release == 'stable'
        with:
          name: package-tarballs
          path: ${{ runner.temp }}/package-tarballs

      # Skips each version npm already has, so a re-run finishes a release
      # that stopped part-way.
      - name: Publish the verified tarballs
        id: publish
        if: needs.plan.outputs.release == 'stable'
        run: >-
          node scripts/publish-tarballs.mjs
          --pack-dir "$RUNNER_TEMP/package-tarballs"
          ${{ inputs.dry-run && '--dry-run' || '' }}

  github-release:
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Release notes come from each package's CHANGELOG.md.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Skips tags and releases that exist, so a re-run is safe.
      - name: Tag the release and write GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          UNRELEASED: ${{ needs.plan.outputs.unreleased }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: >-
          node scripts/github-releases.mjs
          --packages "$UNRELEASED"
          --sha "$GITHUB_SHA"
          ${{ inputs.dry-run && '--dry-run' || '' }}

  # The production docs manifest, built from the release commit, on
  # docs-meta. The website pins the commit this outputs, so live docs move
  # only when the website ships this release.
  docs:
    needs: publish
    # Explicit, since a skipped job further up (checks, on a docs-only run)
    # would otherwise skip this one too.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      manifest-sha: ${{ steps.manifest.outputs.manifest-sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Each file's lastModified comes from its git history.
          fetch-depth: 0

      # A dry run makes the manifest commit without pushing it.
      - name: Publish the manifest to docs-meta
        id: manifest
        uses: ./.github/actions/publish-docs-manifest
        with:
          branch: docs-meta
          dry-run: ${{ inputs.dry-run == true }}

  # The website installs these versions on its development branch, which
  # deploys to next.gridkitjs.com, and reads the docs from docs-meta-next.
  website-snapshot:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # A token for the website's repository: sending it an event needs
      # contents: write there. A dry run sends nothing, so it mints none.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: ${{ !inputs.dry-run }}
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: website
          permission-contents: write

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Send gridkit-snapshot to the website
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSIONS: ${{ needs.snapshot.outputs.versions }}
        run: >-
          node scripts/website-dispatch.mjs
          --event gridkit-snapshot
          --sha "$GITHUB_SHA"
          --versions "$VERSIONS"
          ${{ inputs.dry-run && '--dry-run' || '' }}

  # The website opens its own release PR from this: the versions to
  # install, and the docs-meta commit to pin.
  website-release:
    needs: [publish, docs]
    if: ${{ !cancelled() && needs.docs.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: ${{ !inputs.dry-run }}
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: website
          permission-contents: write

      # On a docs-only run the versions come from this commit's packages.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # A docs-only run publishes nothing, so `versions` is empty and the
      # script sends each package's current version, once it has checked
      # npm has it.
      - name: Send gridkit-release to the website
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSIONS: ${{ needs.publish.outputs.versions }}
          MANIFEST_SHA: ${{ needs.docs.outputs.manifest-sha }}
        run: >-
          node scripts/website-dispatch.mjs
          --event gridkit-release
          --sha "$GITHUB_SHA"
          --versions "$VERSIONS"
          --manifest-sha "$MANIFEST_SHA"
          ${{ inputs.dry-run && '--dry-run' || '' }}

  # The apps under examples/ install from npm, so after a release the bot
  # opens a PR moving them to the new versions. A dry run prints the diff.
  examples:
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The bot opens the PR so CI runs on it; one opened with GITHUB_TOKEN
      # starts no workflow, and main's required checks would never report.
      # `workflows: write` because an open PR's branch is moved onto the
      # latest main, which may bring in a workflow change.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: ${{ !inputs.dry-run }}
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bump the examples to the released versions
        id: bump
        env:
          VERSIONS: ${{ needs.publish.outputs.versions }}
        run: >-
          node scripts/bump-examples.mjs
          --versions "$VERSIONS"
          ${{ inputs.dry-run && '--dry-run' || '' }}

      # Updates the same branch and PR when one is still open from an
      # earlier release. Signed commits are made through the API, as the
      # bot.
      - name: Open the pull request
        if: ${{ !inputs.dry-run && steps.bump.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/bump-examples
          delete-branch: true
          sign-commits: true
          add-paths: |
            examples/*/package.json
            examples/*/package-lock.json
          commit-message: "chore(examples): bump to the latest releases"
          title: "chore(examples): bump to the latest releases"
          body: >-
            Moves the apps under `examples/` to the versions just released,
            with their lockfiles refreshed. Examples are not published, so
            this needs no changeset.
